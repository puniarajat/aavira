:root{
  color-scheme: light;
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F4F5F7; --ink:#17202C; --muted:#5A6573; --line:#D3D9E0;
  --blue:#1F5FD6; --red:#D7263D; --yellow:#C98F00; --green:#2E8F55; --on:#FFFFFF;
  --blue-soft:#DCE6FA; --red-soft:#F9DDE1; --yellow-soft:#FBEFCB; --green-soft:#D9F0E2; --prop:#BCC4CE; --prop-d:#7C8796;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#12161C; --surface:#1B2129; --surface-2:#232A34; --ink:#E8ECF1; --muted:#9AA5B3; --line:#2F3844;
    --blue:#6C9BF2; --red:#F0606F; --yellow:#F2C230; --green:#4CC07D; --on:#0E1218;
    --blue-soft:#1F2D48; --red-soft:#3A1F25; --yellow-soft:#3A3118; --green-soft:#183326; --prop:#3A4452; --prop-d:#6B7686;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#12161C; --surface:#1B2129; --surface-2:#232A34; --ink:#E8ECF1; --muted:#9AA5B3; --line:#2F3844;
  --blue:#6C9BF2; --red:#F0606F; --yellow:#F2C230; --green:#4CC07D; --on:#0E1218;
  --blue-soft:#1F2D48; --red-soft:#3A1F25; --yellow-soft:#3A3118; --green-soft:#183326; --prop:#3A4452; --prop-d:#6B7686;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;font-weight:700;line-height:1.08;letter-spacing:.005em;margin:0}
h1{font-size:2.1rem} h2{font-size:1.6rem} h3{font-size:1.25rem}
p{margin:0 0 .6em}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.shell{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px 110px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand svg{width:32px;height:32px;border-radius:8px}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.85rem;color:var(--on);background:var(--blue)}
.avatar.f{background:var(--red)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.section{margin-top:22px}
.section > h2{margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:0;background:var(--blue);color:var(--on);font-weight:600;border-radius:12px;padding:13px 18px;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:.875rem;border-radius:10px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;font-size:.9rem}

/* hero */
.hero{display:flex;gap:18px;align-items:center;padding:6px 0 4px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .day{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:2.4rem;line-height:.9}
.ring .of{font-size:.78rem;color:var(--muted)}
.hero h1{font-size:2.3rem}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-yellow{background:var(--yellow-soft);color:var(--yellow)}
.t-green{background:var(--green-soft);color:var(--green)}

/* workout list */
.block-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.block-h h3{font-size:1.2rem}
.ex{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.check{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:2px}
.check.on{background:var(--green);border-color:var(--green);color:var(--on)}
.check svg{width:16px;height:16px}
.ex-name{font-weight:600;font-size:1.05rem;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.ex-name:hover{text-decoration:underline}
.ex.done .ex-name{color:var(--muted);text-decoration:line-through}
.dose{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:1.15rem;margin-top:2px}
.ex-actions{display:flex;gap:14px;margin-top:6px}
.note{background:var(--yellow-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.note.red{background:var(--red-soft)}
.note.blue{background:var(--blue-soft)}
.note.green{background:var(--green-soft)}

/* calendar */
.cal{display:grid;grid-template-columns:auto repeat(7,1fr);gap:5px;align-items:stretch}
.cal .wk{font-size:.75rem;color:var(--muted);align-self:center;padding-right:4px}
.cal .dh{font-size:.72rem;color:var(--muted);text-align:center}
.cell{border:0;border-radius:9px;padding:6px 2px;min-height:52px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface-2)}
.cell b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.1rem;line-height:1}
.cell span{font-size:.62rem;line-height:1.1}
.cell.c-blue{background:var(--blue-soft);color:var(--blue)}
.cell.c-red{background:var(--red-soft);color:var(--red)}
.cell.c-yellow{background:var(--yellow-soft);color:var(--yellow)}
.cell.c-green{background:var(--green-soft);color:var(--green)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell .tick{font-size:.7rem}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.6rem;line-height:1.05}
.stat span{font-size:.78rem;color:var(--muted)}
.macro{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.macro i{display:block}

/* meals */
.meal{padding:14px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal-h h3{font-size:1.15rem}
.meal ul{margin:6px 0 0;padding-left:18px}
.meal li{margin:2px 0}
.kcal{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;color:var(--muted)}

/* gear */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem}
.gear{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;margin-top:8px}
.gear .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none}
.gear .ic svg{width:24px;height:24px}
.gear.off{opacity:.55}
.exthumb{width:64px;height:64px;flex:none;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--surface-2)}
.exthumb img{width:100%;height:100%;object-fit:cover;display:block}
.exthumb svg{width:100%;height:100%}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}
.frames.one{grid-template-columns:1fr;max-width:220px}
.frames figure{margin:0;background:var(--surface-2);border-radius:10px;padding:4px 4px 6px;text-align:center}
.frames svg{width:100%;height:auto;display:block}
.frames figcaption{font-size:.75rem;font-weight:600;color:var(--muted)}
.gymphoto{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin:8px 0 2px}
.lane{padding:12px 0;border-top:1px solid var(--line)}
.lane:first-child{border-top:0}
.lane-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.track{position:relative;height:20px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px;min-width:20px;transition:width .4s ease}
.track .knob{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:4px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.track .goal{position:absolute;right:-4px;top:-26px;font-size:1rem}
.pct{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.6rem;line-height:1}
.prize{display:flex;gap:12px;align-items:center;background:var(--yellow-soft);border-radius:14px;padding:14px 16px}
.prize .cup{font-size:2rem;line-height:1}
.code{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:2rem;font-weight:700;letter-spacing:.06em;text-align:center;background:var(--surface-2);border-radius:12px;padding:14px;user-select:all;-webkit-user-select:all}
.win{text-align:center;background:var(--green-soft);border-radius:16px;padding:20px 16px}
.win .cup{font-size:3rem;line-height:1}
textarea.input{min-height:110px;font-size:.85rem;font-family:ui-monospace,monospace}
.avatar.ph{padding:0;border:0;overflow:hidden;cursor:pointer;background:var(--surface-2)}
.avatar.ph img{width:100%;height:100%;object-fit:cover;display:block}
.lane .avatar{width:44px;height:44px;flex:none}
.wall{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.wall figure{margin:0;flex:none;width:112px;text-align:center}
.wall button{border:0;padding:0;background:none;cursor:pointer;display:block;width:112px}
.wall img{width:112px;height:112px;object-fit:cover;border-radius:14px;display:block}
.wall figcaption{font-size:.8rem;margin-top:4px;line-height:1.2}
.myphoto{display:flex;gap:14px;align-items:center}
.myphoto img,.myphoto .ph0{width:72px;height:72px;border-radius:16px;object-fit:cover;flex:none;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.nrow{padding:8px 0;border-top:1px solid var(--line)}.nrow:first-child{border-top:0}
.nrow-h{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.nbar{height:8px;border-radius:4px;background:var(--surface-2);margin-top:5px;overflow:hidden}.nbar i{display:block;height:100%;border-radius:4px}
.pkrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.pkrow:first-child{border-top:0}
.stepb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;cursor:pointer;line-height:1}
.qty{min-width:28px;text-align:center;font-weight:600}
.frames.two{grid-template-columns:1fr 1fr}.frames.two img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;display:block}
.eqchk img,.eqchk .noimg{width:56px;height:40px;object-fit:cover;border-radius:8px;flex:none;background:var(--surface-2)}
.rank{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.05rem;color:var(--muted);min-width:30px}
.daychips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.daychips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:center;line-height:1.15}
.daychips button b{display:block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.15rem}
.daychips button span{font-size:.75rem;color:var(--muted)}
.daychips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daychips button.on span{color:var(--bg)}
.shop li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:7px 0}
.shop li:first-child{border-top:0}
.shop{list-style:none;margin:0;padding:0}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2)}
.photos{display:flex;gap:8px;overflow-x:auto;margin:10px -2px 4px;padding:2px;scroll-snap-type:x mandatory}
.photos img{height:220px;width:auto;max-width:85%;border-radius:12px;scroll-snap-align:start;flex:none}
.gear-name{font-weight:600}

/* forms */
.field{margin-top:16px}
.field label,.field .lbl{display:block;font-weight:600;margin-bottom:6px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-width:64px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.choice{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;margin-top:8px}
.choice.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-soft)}
.choice b{display:block;font-size:1.05rem}
.choice span{font-size:.9rem;color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.steps-bar{display:flex;gap:4px;margin:6px 0 18px}
.steps-bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps-bar i.on{background:var(--blue)}
.err{color:var(--red);font-weight:600;margin-top:12px}
.bmi-live{margin-top:12px}
.wiz-foot{display:flex;gap:10px;margin-top:24px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--muted);cursor:pointer}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on svg{color:var(--blue)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .25s ease;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet-in{max-width:520px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-close{float:right;background:var(--surface-2);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1.1rem}
.sheet ol,.sheet ul{padding-left:20px;margin:6px 0 12px}
.sheet li{margin:5px 0}
.sheet h3{margin-top:16px}
details.exd{border-top:1px solid var(--line);padding:10px 0}
details.exd summary{cursor:pointer;font-weight:600}

/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 20px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.3rem;font-weight:700;cursor:pointer;display:none}
.timer.show{display:block}
.timer.done{background:var(--green);color:var(--on)}

@media (prefers-reduced-motion: reduce){.sheet,.backdrop,.track .fill{transition:none}}
</style>
</head>

<div id="app" class="shell"></div>
<div id="backdrop" class="backdrop" data-act="close-sheet"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheet-in"></div></div>
<button id="timer" class="timer" data-act="stop-timer" aria-live="polite"></button>

/* ===================== CALCULATIONS ===================== */
function bmiOf(w,hcm){const h=hcm/100;return w/(h*h);}

function nutrition(p){
 const w=p.weightKg,h=p.heightCm,a=p.age;
 const bmr=10*w+6.25*h-5*a+(p.gender==='male'?5:-161);
 const life={desk:1.2,feet:1.3,active:1.4}[p.lifestyle]||1.2;
 const tdee=bmr*(life+p.days*0.035);
 const b=bmiOf(w,h);const G=GOALS[p.goal];
 let f=G.kcal==null?(b>=23?0.85:1.0):G.kcal;
 if(p.pregnant) f=Math.max(f,1.0);
 if(p.goal==='muscle'&&b>=27.5) f=0.95;
 let kcal=tdee*f;const floor=p.gender==='male'?1500:1200;kcal=Math.max(kcal,floor);kcal=Math.round(kcal/50)*50;
 const refW=b>27?23*(h/100)*(h/100):w;
 const protein=Math.round(refW*G.protein/5)*5;
 const fat=Math.round(kcal*0.25/9);
 const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
 const water=Math.round(w*0.035*2)/2+(p.days>=5?0.5:0);
 return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,protein,fat,carbs,water,bmi:b};
}

/* ===================== PLAN ENGINE ===================== */
function hasEq(p,spec){return spec.split('|').some(g=>g.split('+').every(id=>id==='mat'||p.equipment.includes(id)));}
function pick(p,pattern,variant,used){
 const ok=PATTERNS[pattern].filter(id=>!used.has(id)&&hasEq(p,EX[id].eq)&&!(EX[id].avoid||[]).some(a=>p.limits.includes(a)));

}
function dose(p,ex,week){
 const G=GOALS[p.goal];let sets=G.sets,reps=ex.iso?G.iso:G.reps,note='';
 if(p.goal==='strength'&&p.exp===1)reps=ex.iso?'10–12':'8–10';
 if(ex.time)reps=G.hold;else if(ex===EX.deadbug||ex===EX.birddog)reps='8–10 per side';
 if(week===1){if(p.month>1)note='Start a little heavier than last month.';else{sets=Math.max(2,sets-1);note='Light weight this week — learn the movement.';}}
 else if(week===3)note='If the last set felt easy, add a little weight.';
 else if(week===4){if(p.exp>1&&sets<5)sets+=1;note='Peak week: aim for your best clean reps.';}
 if(p.pregnant)sets=Math.min(sets,2);
 return {sets,reps,rest:G.rest,restSec:G.restSec,note};
}
function cardioFor(p,week,idx,rest){
 const G=GOALS[p.goal];
 let list=['treadmill','bike','stairclimber','elliptical','rower'].filter(id=>p.equipment.includes(id));
 if(p.limits.includes('knee')){const o=['bike','elliptical','treadmill','rower','stairclimber'];list.sort((a,b)=>o.indexOf(a)-o.indexOf(b));list=list.filter(x=>x!=='stairclimber'||list.length===1);}
 if(p.limits.includes('back'))list=list.filter(x=>x!=='rower').concat(list.includes('rower')&&list.length===1?['rower']:[]);
 if(!list.length)list=['walk'];
 const m=list[idx%list.length];
 if(rest){
  if(['lose','stamina','tone'].includes(p.goal))return {m:'walk',min:25,style:'easy',optional:true};
  return null;
 }
 let style=G.style;
 if(style==='fat')style=week>=3?'intervals':'steady';
 if(style==='intervals'&&week===1)style='steady';
 if(p.pregnant||p.medical)style=style==='intervals'?'steady':style;
 return {m,min:G.cardio[week-1],style};

function cardioMachines(p){
 let list=['treadmill','bike','stairclimber','elliptical','rower'].filter(id=>p.equipment.includes(id));
 if(p.limits.includes('knee')){const o=['bike','elliptical','treadmill','rower','stairclimber'];list.sort((a,b)=>o.indexOf(a)-o.indexOf(b));list=list.filter(x=>x!=='stairclimber'||list.length===1);}
 if(p.limits.includes('back')&&list.length>1)list=list.filter(x=>x!=='rower');

function cardioDayBlocks(p,week,idx){

function buildPlan(p){
 const start=parseKey(p.startDate),tw=TRAIN_DAYS[p.days],seq=SEQ[p.days];let s=0;const out=[];
 for(let i=0;i<28;i++){
  const date=addDays(start,i),key=dkey(date),week=Math.floor(i/7)+1;
  if(!tw.includes(date.getDay())){out.push({key,num:i+1,week,type:'rest',title:'Rest day',short:'Rest',color:'green',cardio:cardioFor(p,week,i,true)});continue;}
  const tpl=seq[s%seq.length],T=TEMPLATES[tpl],variant=(Math.floor(s/seq.length)%2)+(p.month-1);s++;
  if(tpl==='cardioday'){const used=new Set(),ex=[];const nc=p.sessionMin>=60?3:2;for(let j=0;j<nc;j++){const id=pick(p,'core',variant+j,used);if(id){used.add(id);ex.push({id,...dose(p,EX[id],week)});}}
   out.push({key,num:i+1,week,type:tpl,title:T.title,short:T.short,color:T.color,ex,cardios:cardioDayBlocks(p,week,s)});continue;}
  let slots=T.slots.slice();
  const fs={lower:'glute',upper:'lateral',core:'core'}[p.focus];

  const n=PER_SESSION[p.sessionMin]||6;
  slots=slots.slice(0,n-1);
  if(fs&&fOk&&fOk.includes(tpl)&&fs!=='core'&&!slots.includes(fs)){slots.splice(2,0,fs);slots=slots.slice(0,n-1);}
  slots.push('core');if(p.focus==='core')slots.push('core');
  const used=new Set(),ex=[];
  slots.forEach((sl,j)=>{const id=pick(p,sl,variant+j*0,used);if(id){used.add(id);ex.push({id,...dose(p,EX[id],week)});}});
  out.push({key,num:i+1,week,type:tpl,title:T.title,short:T.short||T.title.split(' ')[0],color:T.color,ex,cardios:[cardioFor(p,week,s,false)]});
 }
 return out;
}

/* ===================== DIET ENGINE ===================== */
function dietOk(p,x){return x==='v'||(x==='e'&&p.diet!=='v')||(x==='n'&&p.diet==='n');}
function targetsOf(p){const n=nutrition(p);return {...n,fibre:Math.round(n.kcal/1000*15),iron:p.gender==='female'?29:19,calcium:1000};}
function totalsOf(items){const t={kcal:0,p:0,c:0,f:0,fi:0,fe:0,ca:0};items.forEach(([id,q])=>{const D=DISHES[id];if(!D)return;for(const k in t)t[k]+=D[k]*q;});return t;}
function tplFor(p,kind){const T=TPL[kind];return [...T.v,...(p.diet!=='v'?T.e:[]),...(p.diet==='n'?T.n:[])];}
function scaleItems(items,target){const base=totalsOf(items).kcal||1,f=Math.min(2.2,Math.max(0.5,target/base));return items.map(([id,q])=>{const D=DISHES[id];if(FIXED.has(id))return [id,q];return [id,Math.max(D.st,Math.round(q*f/D.st)*D.st)];});}
function mealsFor(p,dk){
 const T=targetsOf(p),train=isTrainDay(p,dk),rows=train?GYM_SLOTS[p.gymTime||'evening'].rows:REST_ROWS,dd=dayDiff(p.startDate,dk);
 return rows.map(([kind,time,share,tag],mi)=>{
  const pick=(p.mealPick||{})[dk+'|'+kind];let items,custom=false;
  const okPick=pick?pick.filter(([id])=>DISHES[id]&&dietOk(p,DISHES[id].d)):[];if(okPick.length){items=okPick;custom=true;}
  else{let opts=tplFor(p,kind);
   if(tag==='post'){opts=opts.slice().sort((a,b)=>{const ta=totalsOf(a),tb=totalsOf(b);return tb.p/tb.kcal-ta.p/ta.kcal;});opts=opts.slice(0,Math.max(3,Math.ceil(opts.length*0.6)));}
   const sw=(p.swaps||{})[dk+':'+kind]||0,L=opts.length;items=scaleItems(opts[(((dd+mi*3+sw)%L)+L)%L],T.kcal*share);}
  const tgt={kcal:T.kcal*share,p:T.protein*share,c:T.carbs*share,f:T.fat*share,fi:T.fibre*share};
  return {kind,name:kind==='p'?'Pre-workout snack':KIND_NAME[kind],time:hm(time),tag,share,items,tot:totalsOf(items),tgt,custom};});
}
function unitText(D,q){const u=q===1||!D.u.match(/^[a-z]+$/)?D.u:(D.u==='katori'?'katori':D.u.endsWith('h')||D.u.endsWith('s')?D.u+'es':D.u+'s');return `${frac(q)} ${u}${D.note?` (${D.note}${q!==1?' each':''})`:''}`;}

 if(kind==='kcal')return r<0.88?'low':r>1.12?'high':'ok';
 if(kind==='p'||kind==='fi'||kind==='fe'||kind==='ca')return r<0.85?'low':'ok';
 return r<0.75?'low':r>1.3?'high':'ok';}
const NUT=[['kcal','Calories','kcal'],['p','Protein','g'],['c','Carbs','g'],['f','Fat','g'],['fi','Fibre','g'],['fe','Iron','mg'],['ca','Calcium','mg']];
const FIX_TIP={p:'Add dal, paneer, curd, sprouts, eggs, chicken or fish.',fi:'Add salad, a fruit, sprouts or a millet roti.',fe:'Add palak, rajma, chana, bajra roti or gur chana, with lemon for absorption.',ca:'Add curd, milk, paneer, ragi or tofu.',kcal:'',c:'Adjust roti or rice.',f:'Go easy on ghee, butter and fried food.'};

function renderDiet(p){

function canCrypto(){return !!(window.crypto&&crypto.subtle);}
function busyTyping(){const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
async function topicOf(code){return 'spotter_'+(await hashHex('spotter-topic:'+normCode(code))).slice(0,24);}
async function syncGroup(code,force){
 const holders=DB.profiles.filter(q=>{const g=gFind(q,code);return g&&g.kind!=='test';});if(!holders.length)return;
 const c=normCode(code),topic=await topicOf(code);DB.relay=DB.relay||{};const rs=DB.relay[c]=DB.relay[c]||{};
 try{
  for(const q of holders){const g=gInit(gFind(q,code)),snap=buildSnap(q,g);const sig=JSON.stringify([snap.name,snap.gname,snap.ms&&snap.ms.id,snap.prog,snap.reached]);
   if(force||sig!==g.lastSig||Date.now()-(g.lastPostAt||0)>3*3600e3){await fetch(RELAY+topic,{method:'POST',body:await seal(c,snap)});g.lastSig=sig;g.lastPostAt=Date.now();}
   if(q.photo&&(g.lastPhotoTs!==q.photoTs||Date.now()-(g.lastPhotoAt||0)>6*3600e3)){const raw=q.photo,n=Math.ceil(raw.length/2000);for(let i=0;i<n;i++)await fetch(RELAY+topic,{method:'POST',body:await seal(c,{v:2,t:'ph',id:q.id,ts:q.photoTs,i,n,d:raw.slice(i*2000,(i+1)*2000)})});g.lastPhotoTs=q.photoTs;g.lastPhotoAt=Date.now();}}
  const since=rs.lastPoll?Math.floor(rs.lastPoll/1000)-120:'12h';
  const r=await fetch(RELAY+topic+'/json?poll=1&since='+since);const lines=(await r.text()).split('\n').filter(Boolean);
  for(const ln of lines){try{const ev=JSON.parse(ln);if(ev.event!=='message'||!ev.message)continue;const sn=await unseal(c,ev.message);if(sn.t==='ph'){gotChunk(sn);continue;}holders.forEach(q=>applySnap(q,gFind(q,code),sn));}catch(e){}}
  rs.lastPoll=Date.now();holders.forEach(q=>{const g=gFind(q,code);g.lastSync=Date.now();g.syncErr='';});
 }catch(e){holders.forEach(q=>{const g=gFind(q,code);if(g)g.syncErr='offline';});}
}
async function syncAll(force){
 if(!canCrypto())return;if(syncing){syncAgain=true;return;}syncing=true;
 try{const codes=[...new Set(DB.profiles.flatMap(q=>groupsOf(q).filter(g=>g.kind!=='test').map(g=>g.code)))];for(const c of codes)await syncGroup(c,force);}catch(e){}
 syncing=false;save();if(ui.mode==='app'&&ui.tab==='race'&&!busyTyping()&&!sheetOpen)render();
 if(syncAgain){syncAgain=false;await syncAll(true);}
}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncAll(),15000);}
function ago(ts){if(!ts)return 'never';const m=Math.round((Date.now()-ts)/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');const dd=Math.round(h/24);return dd+(dd===1?' day ago':' days ago');}
function copyText(txt){try{navigator.clipboard.writeText(txt).catch(()=>{});}catch(e){}const t=document.getElementById('copysrc');if(t){t.focus();t.select();try{document.execCommand('copy');}catch(e){}}}
function photoOf(id){const q=DB.profiles.find(x=>x.id===id);if(q)return q.photo?{data:q.photo,ts:q.photoTs}:null;const r=(DB.photos||{})[id];return r&&/^data:image\/jpeg;base64,/.test(r.data)?r:null;}
function avatarFor(m){const ph=photoOf(m.id);if(ph)return `<button class="avatar ph" data-act="view-photo" data-id="${esc(m.id)}" data-name="${esc(first(m.name))}" aria-label="See ${esc(first(m.name))}’s latest photo"><img alt="" src="${ph.data}"></button>`;return `<span class="avatar ${m.gender==='female'?'f':''}">${esc(first(m.name).slice(0,1).toUpperCase())}</span>`;}
function myPhotoBox(p){return `<section class="section"><div class="panel myphoto">${p.photo?`<img alt="Your latest photo" src="${p.photo}">`:'<span class="ph0">No photo yet</span>'}<div class="grow"><b>Your show-off photo</b><p class="small muted" style="margin:2px 0 8px">${p.photo?'Updated '+ago(p.photoTs)+'. A new upload replaces it.':'Everyone in your groups sees your latest photo.'}</p><label class="btn sm" for="photo-in" style="display:inline-block">${p.photo?'Upload a new photo':'Upload a photo'}</label><input id="photo-in" type="file" accept="image/*" hidden></div></div></section>`;}
function photoWall(p,list){const items=list.map(m=>({m,ph:photoOf(m.id)})).filter(x=>x.ph);if(!items.length)return '';return `<section class="section"><h2>Latest photos</h2><div class="wall">${items.map(({m,ph})=>`<figure><button data-act="view-photo" data-id="${esc(m.id)}" data-name="${esc(first(m.name))}"><img alt="${esc(first(m.name))}’s latest photo" src="${ph.data}"></button><figcaption><b>${esc(first(m.name))}${m.me?' (you)':''}</b><br><span class="muted">${ago(ph.ts)}</span></figcaption></figure>`).join('')}</div></section>`;}
async function handlePhoto(file){
 const p=P();
 try{
  const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const draw=S=>{const c=document.createElement('canvas');c.width=S;c.height=S;const k=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,S,S);return c;};
  let c=draw(320),q=0.72,data=c.toDataURL('image/jpeg',q);
  while(data.length>20000&&q>0.3){q-=0.08;data=c.toDataURL('image/jpeg',q);}
  if(data.length>20000){c=draw(220);data=c.toDataURL('image/jpeg',0.6);}
  URL.revokeObjectURL(url);
  p.photo=data;p.photoTs=Date.now();save();render();syncAll(true);
 }catch(e){openSheet('<h2>Couldn’t use that photo</h2><p>Try a different photo, such as a JPG or PNG from your gallery.</p>');}
}
const PHBUF={};
function gotChunk(s){if(!s.id||DB.profiles.some(x=>x.id===s.id))return;const cur=(DB.photos||{})[s.id];if(cur&&cur.ts>=s.ts)return;const k=s.id+':'+s.ts;const b=PHBUF[k]=PHBUF[k]||{n:s.n,parts:{}};b.parts[s.i]=String(s.d||'');
 if(Object.keys(b.parts).length===b.n){const data=[...Array(b.n)].map((_,i)=>b.parts[i]).join('');if(/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(data)&&data.length<40000){DB.photos=DB.photos||{};DB.photos[s.id]={ts:s.ts,data};}delete PHBUF[k];}}
function curGroup(){const p=P();return p&&ui.gid?gFind(p,ui.gid):null;}
/* ---------- views ---------- */
function lane(m,rank,lead){
 const pct=m.prog?m.prog.pct:0,col=m.me?'blue':(m.gender==='female'?'red':'yellow');
 const sub=m.prog?esc(m.prog.text):'Waiting for their app to sync';
 const where=m.where==='remote'?`, updated ${ago(m.ts)}`:m.where==='phone'?', on this phone':m.where==='practice'?', practice':'';
 return `<div class="lane"><div class="lane-h"><span class="rank">${ordinal(rank)}</span>${avatarFor(m)}<div class="grow"><b>${esc(first(m.name))}${m.me?' (you)':''}</b>${lead?' <span class="tag t-green">Leading</span>':''}${m.reached?' <span class="tag t-yellow">Finished</span>':''}<div class="muted small">${sub}<span>${where}</span></div></div><span class="pct">${Math.round(pct*100)}%</span></div>
 <div class="track" role="img" aria-label="${esc(first(m.name))}: ${Math.round(pct*100)}% of the goal"><div class="fill" style="width:${pct*100}%;background:var(--${col})"></div><span class="knob" style="left:${Math.max(3,Math.min(97,pct*100))}%;background:var(--${col})"></span><span class="goal" aria-hidden="true">🏁</span></div></div>`;
}
function groupCard(p,g){
 const ms=g.ms,mem=membersOf(p,g),r=ranked(mem),myRank=r.findIndex(m=>m.me)+1,w=ms?winnerOf(p,g):null;
 const status=!ms?'No milestone yet':w?(w.me?'🏆 You won':esc(first(w.name))+' won'):`You’re ${ordinal(myRank)} of ${mem.length}`;
 return `<button class="gear" data-act="open-group" data-v="${esc(g.code)}"><span class="ic t-${g.kind==='test'?'yellow':'blue'}">${IC.race}</span><span class="grow"><span class="gear-name">${esc(g.name)}</span><br><span class="muted small">${mem.length} ${mem.length===1?'member':'members'}. ${ms?esc(msTitle(ms)):'Set a milestone to start racing'}</span></span><span class="small" style="font-weight:600;text-align:right">${status}</span></button>`;
}
function renderRace(p){
 const g=curGroup();if(g)return renderGroup(p,g);
 const gs=groupsOf(p);
 let h=`<section class="section"><h1>Milestones</h1><p class="muted">Race your friends to a goal. Whoever gets there first wins the prize you agree on. You can be in as many groups as you like, each with its own race.</p></section>`;
 h+=`<section class="section">${gs.length?gs.map(x=>groupCard(p,x)).join(''):'<div class="panel"><p style="margin:0">You’re not in a group yet. Create one and invite friends, or join with a code a friend sent you.</p></div>'}</section>`;
 h+=`<section class="section"><div class="row"><button class="btn grow" data-act="g-create">Create a group</button><button class="btn ghost grow" data-act="g-join">Join with a code</button></div></section>`;
 h+=myPhotoBox(p);

 return h;
}
function renderGroup(p,g){
 gInit(g);const ms=g.ms,mem=membersOf(p,g),net=g.kind!=='test';
 let h=`<section class="section"><button class="linkbtn" data-act="groups-back">‹ All groups</button><h1 style="margin-top:8px">${esc(g.name)}</h1><p class="muted small">${mem.length} ${mem.length===1?'member':'members'}${g.kind==='test'?', practice group':''}</p></section>`;
 if(net)h+=`<section class="section"><details class="panel" ${mem.length<2?'open':''}><summary style="cursor:pointer;font-weight:600">Invite friends</summary><p class="small muted" style="margin-top:8px">Friends open AAVIRA → Milestone → Join with a code, and enter:</p><div class="code">${esc(g.code)}</div>
  <div class="row" style="margin-top:10px"><a class="btn grow" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Join my AAVIRA gym group “'+g.name+'”! Open AAVIRA → Milestone → Join with a code, and enter: '+g.code)}">Share on WhatsApp</a><button class="btn ghost" data-act="g-copy">Copy</button></div>
  <input id="copysrc" class="input" style="position:absolute;left:-9999px" value="${esc(g.code)}" readonly aria-hidden="true">
  ${DB.profiles.some(q=>q.id!==p.id&&!gFind(q,g.code))?'<button class="btn block ghost" style="margin-top:8px" data-act="g-local-add">Add someone who uses this phone</button>':''}</details></section>`;
 if(!ms||ui.msForm){
  const f=ui.msDraft=ui.msDraft||{type:'workouts',target:20,title:'',prize:''};const T=MS_TYPES[f.type];
  h+=`<section class="section"><h2>${ms?'Start a new milestone':'Set a milestone'}</h2><p class="muted small">One goal, the same for everyone in ${esc(g.name)}. Progress is tracked automatically, so nobody has to update anything.</p>
  ${Object.entries(MS_TYPES).map(([k,t])=>`<button class="choice ${f.type===k?'on':''}" data-act="ms-type" data-v="${k}" aria-pressed="${f.type===k}"><b>${t.label}</b><span>${t.desc}</span></button>`).join('')}
  <div class="field"><label class="lbl" for="ms-goal">Goal (${T.unit})</label><input id="ms-goal" class="input" type="number" inputmode="decimal" data-f="ms.target" value="${esc(f.target)}"><div class="seg" style="margin-top:8px" role="group" aria-label="Quick picks">${T.targets.map(v=>`<button class="${Number(f.target)===v?'on':''}" data-act="ms-target" data-v="${v}">${v}</button>`).join('')}</div><p class="small muted" style="margin-top:6px">Type any number, or tap a quick pick.</p></div>
  <div class="field"><label for="ms-title">Name (optional)</label><input id="ms-title" class="input" maxlength="50" placeholder="e.g. Diwali shape-up challenge" data-f="ms.title" value="${esc(f.title||'')}"></div>
  <div class="field"><label for="ms-prize">Prize for the winner</label><input id="ms-prize" class="input" maxlength="80" placeholder="e.g. Everyone else buys the winner a smoothie" data-f="ms.prize" value="${esc(f.prize||'')}"></div>
  ${ui.msErr?`<p class="err" role="alert">${esc(ui.msErr)}</p>`:''}
  <div class="wiz-foot">${ms?'<button class="btn ghost" data-act="ms-back">Cancel</button>':''}<button class="btn grow" data-act="ms-start">Start milestone</button></div></section>`;
  return h+histBox(g)+(net?syncBox(g)+manualBox():'')+`<section class="section"><button class="btn block danger" data-act="g-leave">Leave this group</button></section>`;
 }
 const r=ranked(mem),w=winnerOf(p,g),me=r.find(m=>m.me),myRank=r.indexOf(me)+1;
 const wall=photoWall(p,r);
 if(ms.prize)h+=`<section class="section prize"><span class="cup" aria-hidden="true">🏆</span><div><div class="small muted">Prize</div><b>${esc(ms.prize)}</b></div></section>`;
 if(w)h+=`<section class="section win"><div class="cup" aria-hidden="true">🏆</div><h2 style="margin-top:6px">${w.me?'You won!':esc(first(w.name))+' won!'}</h2><p class="muted" style="margin:6px 0 12px">${esc(first(w.name))} reached “${esc(msTitle(ms))}” first, on ${nice(dkey(new Date(w.reached)))}.${ms.prize?' Prize: '+esc(ms.prize)+'.':''}</p><button class="btn" data-act="ms-new">Start a new milestone</button></section>`;
 const top=r[0]&&r[0].prog?r[0].prog.pct:0;
 h+=`<section class="section"><h2>${esc(msTitle(ms))}</h2><p class="muted small" style="margin-top:2px">${ms.title?'Goal: '+esc(goalText(ms))+'. ':''}Started ${nice(ms.start)}${ms.by?' by '+esc(first(ms.by)):''}</p><div class="panel" style="margin-top:10px">${r.map((m,i)=>lane(m,i+1,!w&&i===0&&top>0&&(!r[1]||!r[1].prog||r[1].prog.pct<top))).join('')}</div>`;
 if(!w&&r.length>1&&me.prog){const unit=v=>ms.type==='wloss'?`${Math.round(v*10)/10}% body weight`:ms.type==='workouts'?`${v} workout${v===1?'':'s'}`:ms.type==='cardio'?`${v} cardio minutes`:`${Math.round(v*100)} percentage points`;
  const diff=(a,b)=>(ms.type==='weight'||ms.type==='custom')?Math.abs(a.prog.pct-b.prog.pct):Math.abs(a.prog.val-b.prog.val);
  let msg;const other=myRank===1?r[1]:r[0];
  if(!other.prog)msg='Waiting for the others to sync.';
  else if(other.prog.pct===me.prog.pct)msg=`You’re level with ${esc(first(other.name))}. Your next workout could change that.`;
  else if(myRank===1)msg=`You lead by ${unit(diff(me,other))} over ${esc(first(other.name))}.`;
  else msg=`You’re ${ordinal(myRank)} of ${r.length}. ${esc(first(other.name))} leads by ${unit(diff(other,me))}.`;
  h+=`<div class="note green">${msg}</div>`;}
 if(ms.type==='custom')h+=`<div class="note">This milestone was set in an older version. Start a new one so everyone is tracked automatically.</div>`;
 if(me.prog&&me.prog.noTarget)h+=`<div class="panel" style="margin-top:10px"><label class="lbl" for="mytg"><b>Set your target weight (kg)</b></label><div class="row" style="margin-top:6px"><input id="mytg" class="input" type="number" inputmode="decimal" placeholder="Now ${p.weightKg} kg"><button class="btn" data-act="ms-settarget">Save</button></div></div>`;
 if(ms.type==='weight'||ms.type==='wloss')h+=`<p class="small muted" style="margin-top:8px">Progress updates when you log your weight. <button class="linkbtn" data-act="weigh">Log weight now</button></p>`;
 h+=`</section>`;
 h+=wall||(p.photo?'':`<section class="section"><div class="note blue">Show off your progress: upload your latest photo from the Milestone tab’s main page. Everyone in the group sees it.</div></section>`);

 if(!w)h+=`<section class="section"><button class="btn block ghost" data-act="ms-new">Replace with a new milestone</button></section>`;
 return h+histBox(g)+(net?syncBox(g)+manualBox():'')+`<section class="section"><button class="btn block danger" data-act="g-leave">Leave this group</button></section>`;
}
function syncBox(g){return `<section class="section"><p class="small muted">Synced ${ago(g.lastSync)}. <button class="linkbtn" data-act="sync">Sync now</button></p>${g.syncErr==='offline'?'<div class="note red">Couldn’t reach the sync service. Check your internet, or use “Send by message” below.</div>':''}${canCrypto()?'':'<div class="note red">Automatic sync isn’t supported on this device. Use “Send by message” below.</div>'}</section>`;}
function histBox(g){if(!g.hist.length)return '';return `<section class="section"><h2>Past milestones</h2><div class="panel">${g.hist.map(x=>`<div class="meal"><b>${esc(x.t)}</b><div class="small muted">${x.w?'Won by '+esc(first(x.w)):'Replaced before anyone finished'}${x.prize?'. Prize: '+esc(x.prize):''}</div></div>`).join('')}</div></section>`;}
function manualBox(){return `<section class="section"><details class="panel"><summary style="cursor:pointer;font-weight:600">No internet? Send by message</summary><p class="small muted" style="margin-top:8px">Send your latest progress as an encrypted message on WhatsApp, and paste the ones your friends send you.</p><div class="row"><button class="btn sm" data-act="send-update">Send my update</button><button class="btn sm ghost" data-act="paste-update">Paste a friend’s update</button></div></details></section>`;}

/* ===================== RENDER ===================== */
function render(){
 const app=$('#app');
 if(ui.mode==='auth'){app.innerHTML=renderAuth();$('.nav')?.remove();return;}
 if(ui.mode==='wizard'){app.innerHTML=renderWizard();$('.nav')?.remove();return;}
 const p=P();
 app.innerHTML=topbar(p)+({today:renderToday,plan:renderPlan,diet:renderDiet,gear:renderGear,race:renderRace,me:renderMe}[ui.tab]||renderToday)(p);
 renderNav();
}
function topbar(p){
 return `<header class="topbar"><div class="brand">${IC.plate}AAVIRA</div>
 <button class="who" data-act="people" aria-label="Switch person"><span class="avatar ${p.gender==='female'?'f':''}">${esc(p.name.slice(0,1).toUpperCase())}</span><span>${esc(p.name.split(' ')[0])}</span></button></header>`;
}
function renderNav(){
 let n=$('.nav');if(!n){n=document.createElement('nav');n.className='nav';document.body.appendChild(n);}
 const tabs=[['today','Today'],['plan','Plan'],['diet','Diet'],['race','Milestone'],['me','Profile']];
 n.innerHTML=`<div class="nav-in">${tabs.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-v="${k}" aria-current="${ui.tab===k?'page':'false'}">${IC[k]}${l}</button>`).join('')}</div>`;
}
function banners(p){
 let h='';
 if(p.pregnant)h+=`<div class="note red"><b>Pregnant or recently delivered:</b> this plan is not designed for pregnancy or the postpartum period. Please get your doctor’s approval and ideally a prenatal-certified trainer. Sets and intensity have been reduced and there’s no calorie cut.</div>`;
 else if(p.medical)h+=`<div class="note red">You mentioned a doctor-advised condition. Show this plan to your doctor before starting, and stop any exercise that causes pain, dizziness or chest discomfort.</div>`;
 return h;
}
function ring(pct,color,big,small){
 const r=52,c=2*Math.PI*r,off=c*(1-pct);
 return `<div class="ring"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--${color})" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="center"><div><div class="day">${big}</div><div class="of">${small}</div></div></div></div>`;
}
function progress(p,day){
 if(day.type==='rest')return 0;
 const log=p.log[day.key]||{};const total=day.ex.length+day.cardios.length;
 const done=day.ex.filter(e=>log[e.id]).length+day.cardios.filter((c,i)=>log['cardio'+i]).length;
 return total?done/total:0;
}
function renderToday(p){
 const plan=buildPlan(p),tk=todayKey(),idx=dayDiff(p.startDate,tk);
 if(idx>=28){
  return banners(p)+`<section class="section panel"><h1>Month ${p.month} complete</h1><p class="muted">Great work, ${esc(p.name.split(' ')[0])}. Update your weight and start next month — weights and rep targets step up, and some exercises rotate.</p><button class="btn block" data-act="next-month">Start month ${p.month+1}</button></section>`;
 }
 const day=plan[Math.max(0,idx)],pct=progress(p,day),n=nutrition(p);
 const head=day.type==='rest'
  ?`<div class="hero">${ring(1,'green','Day '+day.num,'of 28')}<div><span class="tag t-green">Rest day</span><h1>Recover today</h1><p class="muted small">${nice(day.key)}, week ${day.week}</p></div></div>`
  :`<div class="hero">${ring(pct,day.color,'Day '+day.num,Math.round(pct*100)+'% done')}<div><span class="tag t-${day.color}">Week ${day.week}</span><h1>${esc(day.title)}</h1><p class="muted small">${nice(day.key)}. ${day.type==='cardioday'?day.cardios.reduce((a,c)=>a+c.min,0)+' min cardio, '+day.ex.length+' core exercises':day.ex.length+' exercises, '+day.cardios[0].min+' min cardio'}</p></div></div>`;
 return banners(p)+head+renderSession(p,day)+
 `<section class="section"><h2>Food today</h2><div class="panel"><div class="row"><div class="grow"><b class="cond" style="font-size:1.8rem">${n.kcal} kcal</b><div class="muted small">${n.protein} g protein, ${n.water} L water</div></div><button class="btn sm ghost" data-act="tab" data-v="diet">See meals</button></div>${(()=>{const ml=mealsFor(p,tk);return ml.map(x=>`<div class="meal"><div class="meal-h"><b>${x.name}${x.tag==='post'?' (post-workout)':''}</b><span class="kcal">${x.time}</span></div><div class="small">${x.items.map(([id,q])=>esc(DISHES[id].n)).join(', ')}</div></div>`).join('');})()}</div></section>`;
}
function photoFor(p,id){return EXPH[id]?IMG(EXPH[id]+'_0'):null;}
function exThumb(p,id){const src=photoFor(p,id);return `<button class="exthumb" data-act="how" data-ex="${id}" aria-label="How to do ${esc(EX[id].n)}">${src?`<img alt="" src="${src}">`:figSVG(id,1)}</button>`;}
function renderSession(p,day){
 if(day.type==='rest'){
  const c=day.cardio;
  return `<div class="section panel"><p>Muscles grow while you rest. Sleep 7–8 hours and drink enough water.</p>${c?`<p><b>Optional:</b> ${c.min} min easy walk (outdoors or treadmill), plus 5–10 min stretching.</p>`:'<p>Light stretching is enough today.</p>'}</div>`;
 }
 const log=p.log[day.key]||{};const c=day.cardios[0];

 ${e.kind==='machine'?`<h3>Rules for every weight machine</h3><ul>${MACHINE_RULES.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}

 ${exs.length?`<h3>Exercises on this</h3>${exs.map(([k,x])=>`<details class="exd"><summary>${esc(x.n)}</summary>${exPhotos(k)}<ol>${x.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="small"><b>Tip:</b> ${esc(x.cue)}</p></details>`).join('')}`:''}
`);}

/* ===================== TIMER ===================== */
let tInt=null;
function startTimer(sec){clearInterval(tInt);const el=$('#timer');let left=sec;el.classList.add('show');el.classList.remove('done');
 const draw=()=>{el.textContent=left>0?`Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}, tap to stop`:'Next set! Tap to close';};draw();
 tInt=setInterval(()=>{left--;draw();if(left<=0){clearInterval(tInt);el.classList.add('done');try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}}},1000);}
function stopTimer(){clearInterval(tInt);$('#timer').classList.remove('show');}

/* ===================== EVENTS ===================== */
const ACT={


 'view-photo':t=>{const ph=photoOf(t.dataset.id);if(!ph)return;openSheet(`<h2>${esc(t.dataset.name||'')}</h2><p class="small muted">Latest photo, ${ago(ph.ts)}</p><img alt="" src="${ph.data}" style="width:100%;border-radius:14px;margin-top:8px">`);},
 'open-group':t=>{ui.gid=t.dataset.v;ui.msForm=false;ui.msDraft=null;ui.msErr='';hpush({tab:'race',gid:ui.gid});render();window.scrollTo(0,0);},
 'groups-back':()=>{if(IS_APP&&history.state&&history.state.gid){history.back();return;}ui.gid=null;ui.msForm=false;render();window.scrollTo(0,0);},
 'g-create':()=>{if(!canCrypto()){openSheet('<h2>Not supported here</h2><p>This device can’t create secure group codes. Use the installed Android app.</p>');return;}openSheet(`<h2>Create a group</h2><label class="lbl" for="gname"><b>Group name</b></label><input id="gname" class="input" maxlength="40" placeholder="e.g. Office gym gang" style="margin-top:6px"><p class="small muted" style="margin-top:8px">You’ll get an invite code to share with friends.</p><button class="btn block" data-act="g-create-go">Create group</button>`);},
 'g-create-go':()=>{const p=P(),name=($('#gname').value||'').trim()||'Gym buddies';const g=gInit({code:newCode(),name,kind:'net',created:Date.now()});groupsOf(p).push(g);save();closeSheet();ui.gid=g.code;ui.msForm=false;ui.msDraft=null;render();window.scrollTo(0,0);syncAll(true);},
 'g-join':()=>{if(!canCrypto()){openSheet('<h2>Not supported here</h2><p>Use the installed Android app to join groups.</p>');return;}openSheet(`<h2>Join a group</h2><input id="pcode" class="input" style="text-transform:uppercase;font-size:1.2rem;letter-spacing:.05em" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"><p id="pcode-err" class="err" role="alert"></p><button class="btn block" data-act="g-join-go">Join group</button>`);},
 'g-join-go':()=>{const v=normCode($('#pcode').value),p=P();if(v.length!==16){$('#pcode-err').textContent='The code has 16 letters and numbers. Check it and try again.';return;}if(gFind(p,fmtCode(v))){$('#pcode-err').textContent='You’re already in this group.';return;}const g=gInit({code:fmtCode(v),name:'Joined group',kind:'net',created:Date.now()});groupsOf(p).push(g);save();closeSheet();ui.gid=g.code;ui.msForm=false;render();window.scrollTo(0,0);syncAll(true);},
 'g-copy':()=>copyText(curGroup().code),
 'g-local-add':()=>{const p=P(),g=curGroup(),cand=DB.profiles.filter(q=>q.id!==p.id&&!gFind(q,g.code));openSheet(`<h2>Add people on this phone</h2><p class="muted small">They’ll see this group when they switch to their profile.</p>${cand.map(q=>`<label class="chk"><input type="checkbox" data-lp="${q.id}"> ${esc(q.name)}</label>`).join('')}<button class="btn block" style="margin-top:12px" data-act="g-local-go">Add to group</button>`);},
 'g-local-go':()=>{const p=P(),g=curGroup();document.querySelectorAll('[data-lp]:checked').forEach(el=>{const q=DB.profiles.find(x=>x.id===el.dataset.lp);if(!q||gFind(q,g.code))return;const ng=gInit({code:g.code,name:g.name,kind:'net',created:g.created});groupsOf(q).push(ng);if(g.ms)setMs(q,ng,g.ms);});save();closeSheet();render();syncAll(true);},
 'g-leave':async()=>{const p=P(),g=curGroup();if(!confirm(`Leave ${g.name}? Your own workout progress stays.`))return;
  if(g.kind!=='test'&&canCrypto()){try{const c=normCode(g.code);fetch(RELAY+await topicOf(g.code),{method:'POST',body:await seal(c,{v:2,id:p.id,left:true,ts:Date.now()})}).catch(()=>{});}catch(e){}}
  p.groups=groupsOf(p).filter(x=>x.code!==g.code);ui.gid=null;save();render();window.scrollTo(0,0);},
 sync:()=>syncAll(true),
 'auth-tab':t=>{ui.auth.tab=t.dataset.v;ui.auth.err='';const u=$('#au-user');if(u)ui.auth.user=u.value;render();},
 'auth-go':()=>authGo(),
 logout:()=>signOutNow(true),
 'ms-type':t=>{ui.msDraft.type=t.dataset.v;ui.msDraft.target=MS_TYPES[t.dataset.v].def||0;ui.msErr='';render();},
 'ms-target':t=>{ui.msDraft.target=Number(t.dataset.v);render();},
 'ms-new':()=>{ui.msForm=true;ui.msDraft=null;ui.msErr='';render();window.scrollTo(0,0);},
 'ms-back':()=>{ui.msForm=false;ui.msErr='';render();},
 'ms-start':()=>{const p=P(),g=curGroup(),f=ui.msDraft,T=MS_TYPES[f.type],n=Number(f.target);
  if(!(n>=T.lim[0]&&n<=T.lim[1])){ui.msErr=`Enter a goal between ${T.lim[0]} and ${T.lim[1]} ${T.unit}.`;render();return;}
  const ms={id:'m'+Date.now(),type:f.type,target:f.type==='wloss'?Math.round(n*10)/10:Math.round(n),title:(f.title||'').trim().slice(0,50),prize:(f.prize||'').trim().slice(0,80),start:todayKey(),created:Date.now(),by:p.name};
  setMs(p,g,ms);propagateMs(p,g);ui.msForm=false;ui.msDraft=null;ui.msErr='';save();render();window.scrollTo(0,0);syncAll(true);},
 'ms-settarget':()=>{const p=P(),g=curGroup(),v=Number($('#mytg').value);if(!(v>=30&&v<=250)||v===p.weightKg)return;g.myTarget[g.ms.id]=v;evalReached(p,g);save();render();scheduleSync();},
 'send-update':async()=>{const p=P(),g=curGroup();if(!canCrypto())return;const str=await seal(normCode(g.code),buildSnap(p,g));openSheet(`<h2>Send my update</h2><p class="muted">Send this to your group. Only members’ apps can read it.</p><a class="btn block" style="text-align:center;text-decoration:none;display:block" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(str)}">Send on WhatsApp</a><textarea id="copysrc" class="input" style="margin-top:10px" readonly>${esc(str)}</textarea><button class="btn block ghost" style="margin-top:8px" data-act="copy-update">Copy</button>`);},
 'copy-update':()=>copyText($('#copysrc').value),
 'paste-update':()=>openSheet(`<h2>Paste a friend’s update</h2><textarea id="pupd" class="input" placeholder="Paste the message that starts with SPOTTER1"></textarea><p id="pupd-err" class="err" role="alert"></p><button class="btn block" data-act="apply-update">Update</button>`),
 'apply-update':async()=>{const g=curGroup();try{const sn=await unseal(normCode(g.code),$('#pupd').value);if(DB.profiles.some(x=>x.id===sn.id))throw new Error('self');DB.profiles.forEach(q=>{const qg=gFind(q,g.code);if(qg)applySnap(q,qg,sn);});save();closeSheet();render();}catch(e){$('#pupd-err').textContent='That message couldn’t be read. Make sure it’s from someone in this group.';}},
 tab:t=>{if(ui.tab!==t.dataset.v)hpush({tab:t.dataset.v});if(t.dataset.v==='race')ui.gid=null;ui.tab=t.dataset.v;render();window.scrollTo(0,0);},
 tick:t=>{const p=P(),k=t.dataset.day,e=t.dataset.ex;p.log[k]=p.log[k]||{};p.log[k][e]=!p.log[k][e];updateDsum(p,k);evalAll(p);save();render();scheduleSync();},
 how:t=>openExercise(t.dataset.ex),
 gear:t=>openGear(t.dataset.id),
 timer:t=>startTimer(Number(t.dataset.sec)),
 'stop-timer':()=>stopTimer(),
 'close-sheet':()=>closeSheet(),
 'plan-day':t=>{ui.planDay=t.dataset.v;render();},
 swap:t=>{const p=P(),k=t.dataset.d+':'+t.dataset.m;/*key includes source:label*/p.swaps[k]=(p.swaps[k]||0)+1;save();render();},
 'pk-open':t=>openPicker(t.dataset.d,t.dataset.k),
 'pk-reset':t=>{const p=P();p.mealPick=p.mealPick||{};delete p.mealPick[t.dataset.d+'|'+t.dataset.k];save();render();},
 'pk-cat':t=>{ui.pick.cat=t.dataset.v;pkRefresh();},
 'pk-add':t=>{const it=ui.pick.items.find(x=>x[0]===t.dataset.id),D=DISHES[t.dataset.id];if(it)it[1]+=D.st>=1?1:0.5;else ui.pick.items.push([t.dataset.id,1]);pkRefresh();},
 'pk-inc':t=>{const it=ui.pick.items.find(x=>x[0]===t.dataset.id),D=DISHES[t.dataset.id];if(!it)return;it[1]+=D.st;pkRefresh();},
 'pk-dec':t=>{const it=ui.pick.items.find(x=>x[0]===t.dataset.id),D=DISHES[t.dataset.id];if(!it)return;it[1]-=D.st;if(it[1]<D.st-1e-9)ui.pick.items=ui.pick.items.filter(x=>x!==it);pkRefresh();},
 'pk-save':t=>{const p=P();p.mealPick=p.mealPick||{};const items=ui.pick.items.map(x=>x.slice());const keys=t.dataset.all==='1'?[...Array(7)].map((_,i)=>dkey(addDays(parseKey(todayKey()),i))).filter(k=>mealsFor(p,k).some(m=>m.kind===ui.pick.kind)):[ui.pick.dk];keys.forEach(k=>{if(items.length)p.mealPick[k+'|'+ui.pick.kind]=items.map(x=>x.slice());else delete p.mealPick[k+'|'+ui.pick.kind];});save();closeSheet();render();},
 'diet-day':t=>{ui.dietDay=Number(t.dataset.v);render();},
 'gear-mine':t=>{ui.gearMine=t.checked;render();},
 'eq-toggle':t=>{const p=P(),id=t.dataset.id;p.equipment=t.checked?[...new Set([...p.equipment,id])]:p.equipment.filter(x=>x!==id);save();},
 people:()=>{openSheet(`<h2>Who’s training?</h2>${DB.profiles.map(p=>`<button class="gear" data-act="switch" data-id="${p.id}"><span class="avatar ${p.gender==='female'?'f':''}">${esc(p.name.slice(0,1).toUpperCase())}</span><span class="grow gear-name">${esc(p.name)}<br><span class="muted small">${esc(GOALS[p.goal].label)}</span></span>${p.id===P().id?'<span class="tag t-green">Active</span>':''}</button>`).join('')}<button class="btn block" style="margin-top:14px" data-act="add-person">Add another person</button>`);},
 switch:t=>{DB.active=t.dataset.id;save();closeSheet();ui.planDay=null;ui.msForm=false;ui.msDraft=null;ui.gid=null;render();window.scrollTo(0,0);scheduleSync();},
 'add-person':()=>{closeSheet();ui.mode='wizard';ui.step=0;ui.err='';ui.editing=null;ui.draft=newDraft();render();window.scrollTo(0,0);},
 edit:()=>{ui.mode='wizard';ui.step=0;ui.err='';ui.editing=P().id;ui.draft=profileToDraft(P());render();window.scrollTo(0,0);},
 wcancel:()=>{ui.mode='app';ui.editing=null;ui.err='';render();},
 wset:t=>{const f=t.dataset.f;let v=t.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;else if(['exp','days','sessionMin'].includes(f))v=Number(v);ui.draft[f]=v;ui.err='';render();},
 wtoggle:t=>{const d=ui.draft,v=t.dataset.v;d.limits=d.limits.includes(v)?d.limits.filter(x=>x!==v):[...d.limits,v];render();},
 weq:t=>{const d=ui.draft,id=t.dataset.id;d.equipment=t.checked?[...new Set([...d.equipment,id])]:d.equipment.filter(x=>x!==id);},
 'weq-all':t=>{ui.draft.equipment=t.dataset.v==='1'?EQUIP.map(e=>e.id):[];render();},
 wnext:()=>{ui.err=validate();if(ui.err){render();return;}if(ui.step===STEPS.length-1)finishWizard();else{ui.step++;hpush({wiz:ui.step});render();window.scrollTo(0,0);}},
 wback:()=>{ui.err='';if(IS_APP&&history.state&&history.state.wiz){history.back();return;}ui.step--;render();window.scrollTo(0,0);},
 weigh:()=>{const p=P();openSheet(`<h2>Log today’s weight</h2><p class="muted">Weigh yourself in the morning, before eating, once a week.</p><input id="wt" class="input" type="number" inputmode="decimal" value="${p.weightKg}" aria-label="Weight in kg"><button class="btn block" style="margin-top:12px" data-act="save-weight">Save weight</button>`);},
 'save-weight':()=>{const v=Number($('#wt').value);if(!(v>=30&&v<=250))return;const p=P();p.weightKg=v;p.weights.push({date:todayKey(),kg:v});evalAll(p);save();closeSheet();render();scheduleSync();},
 'next-month':()=>{const p=P();p.month++;p.startDate=todayKey();save();ACT.weigh();render();},
 restart:()=>{if(!confirm('Restart this month from today? Your ticks for this month will stay in history.'))return;const p=P();p.startDate=todayKey();save();ui.planDay=null;render();},
 delete:()=>{const p=P();if(!confirm(`Delete ${p.name}’s profile and all progress?`))return;DB.profiles=DB.profiles.filter(x=>x.id!==p.id);DB.active=DB.profiles[0]?.id||null;save();if(!DB.profiles.length){ui.mode='wizard';ui.step=0;ui.draft=newDraft();}ui.tab='today';render();}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(a){if(t.tagName!=='INPUT')e.preventDefault();a(t,e);}});
document.addEventListener('input',e=>{if(e.target.id==='pk-q'){ui.pick.q=e.target.value;const b=document.getElementById('pk-list');if(b)b.innerHTML=pkList();return;}const f=e.target.dataset.f;if(!f)return;
 if(f==='gearQ'){ui.gearQ=e.target.value;const pos=e.target.selectionStart;render();const s=$('.search');s.focus();s.setSelectionRange(pos,pos);return;}
 if(f.startsWith('ms.')){if(ui.msDraft)ui.msDraft[f.slice(3)]=e.target.value;return;}
 if(ui.draft){ui.draft[f]=e.target.value;const b=$('#bmi-live');if(b)b.innerHTML=bmiLive();}});
window.addEventListener('popstate',e=>{if(sheetOpen){closeSheet(true);return;}if(ui.mode==='wizard'&&ui.step>0){ui.step--;render();return;}if(ui.mode==='app'&&ui.tab==='race'&&ui.gid&&!(e.state&&e.state.gid)){ui.gid=null;ui.msForm=false;render();return;}ui.tab=(e.state&&e.state.tab)||'today';ui.gid=e.state&&e.state.gid||null;render();});
if(IS_APP){try{history.replaceState({tab:'today'},'');}catch(e){}}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='photo-in'&&e.target.files&&e.target.files[0])handlePhoto(e.target.files[0]);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&ui.mode==='auth'&&e.target.id&&e.target.id.startsWith('au-')){e.preventDefault();authGo();}});
DB.profiles.forEach(p=>{try{migrate(p);}catch(e){}if(p.groups)p.groups=p.groups.filter(g=>g.kind!=='test');try{backfill(p);}catch(e){}});save();
render();
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
bootCloud();
setTimeout(()=>{if(ui.mode==='app')syncAll();},800);
let lastBg=Date.now();
setInterval(()=>{if(ui.mode!=='app'||document.visibilityState==='hidden')return;if(ui.tab==='race'||Date.now()-lastBg>600000){lastBg=Date.now();syncAll();}},90000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ui.mode==='app')syncAll();});
</script>
